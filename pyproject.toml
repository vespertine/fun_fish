[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "fun-fish"
version = "0.2.0"
description = "Jouer aux échecs contre des personnalités construites sur Stockfish"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "chess>=1.11",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Maia-2 sans PyTorch (modèle exporté en ONNX, voir `fun-fish maia-export`).
maia = ["onnxruntime>=1.17", "numpy"]
# Simulations contre Maia-2. Installer d'abord PyTorch CPU :
#   pip install "torch==2.8.*" --index-url https://download.pytorch.org/whl/cpu
sim = ["maia2==0.11.0"]

[project.scripts]
fun-fish = "fun_fish.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fun_fish"]

[tool.pytest.ini_options]
testpaths = ["tests"]
